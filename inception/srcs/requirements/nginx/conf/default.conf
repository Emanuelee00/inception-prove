server {
    listen 443 ssl;
    server_name eielmini.42.fr;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html;

    # bonus React/Pacman page, kept off the domain root on purpose: "/" must
    # stay WordPress for the mandatory part of the subject
    location = /app {
        return 301 /app/;
    }

    # a single prefix location is enough: nginx strips the "/app/" prefix
    # and forwards the rest (e.g. /app/assets/x.js -> react:80/assets/x.js)
    location /app/ {
        proxy_pass http://react:80/;
        proxy_set_header Host $host;
    }

    location /pacman/ {
        proxy_pass http://pacman:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
